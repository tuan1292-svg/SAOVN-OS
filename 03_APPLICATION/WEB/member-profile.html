<title>SAOVN-OS — Hồ sơ thành viên</title>
<link rel="stylesheet" href="css/dashboard.css">
<style>
.profile-page{width:100%;max-width:980px;margin:0 auto;padding-bottom:40px;box-sizing:border-box}.profile-card{width:100%;min-width:0;box-sizing:border-box;border:1px solid #ffffff12;border-radius:20px;background:#07101f;padding:24px;box-shadow:0 24px 70px #0005;overflow:hidden}.profile-head{width:100%;min-width:0;display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:18px}.profile-avatar{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#1b55a8,#7257d9);font-size:22px;font-weight:900;flex:0 0 76px}.profile-head>div:nth-child(2){min-width:0}.profile-name{margin:0;font-size:24px;line-height:1.2;overflow-wrap:anywhere}.profile-title{margin:5px 0 0;color:#8ea1bb;font-size:11px;line-height:1.5;overflow-wrap:anywhere}.profile-actions{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;min-width:0}.profile-btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;box-sizing:border-box;border:1px solid #2587ff55;border-radius:9px;background:#1673ef;color:white;padding:9px 13px;font:700 9px Inter,system-ui;cursor:pointer;text-decoration:none}.profile-btn.secondary{background:#ffffff06;color:#dce6f6}.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px}.profile-box{min-width:0;padding:14px;border:1px solid #ffffff10;border-radius:12px;background:#ffffff03;overflow:hidden}.profile-box label{display:block;color:#667791;font-size:7px;letter-spacing:.12em;margin-bottom:6px}.profile-box strong{display:block;font-size:10px;color:#dce6f6;line-height:1.5;overflow-wrap:anywhere}.profile-status{display:inline-block;max-width:100%;margin-top:18px;padding:5px 8px;border-radius:999px;background:#00e67614;color:#00e676;font-size:8px;white-space:nowrap}.profile-loading,.profile-error{padding:30px;text-align:center;color:#8ea1bb;font-size:10px}.profile-back{display:inline-block;margin-bottom:14px;color:#8ec4ff;text-decoration:none;font-size:9px}
@media(max-width:900px){.profile-head{grid-template-columns:64px minmax(0,1fr)}.profile-avatar{width:64px;height:64px;flex-basis:64px}.profile-actions{grid-column:1/-1;justify-content:flex-start}.profile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.profile-card{padding:17px;border-radius:16px}.profile-head{grid-template-columns:52px minmax(0,1fr);gap:12px}.profile-avatar{width:52px;height:52px;flex-basis:52px;border-radius:15px;font-size:16px}.profile-name{font-size:18px}.profile-title{font-size:9px}.profile-actions{gap:6px}.profile-btn{padding:8px 10px;font-size:8px}.profile-grid{grid-template-columns:1fr;margin-top:16px}}
</style>
</head>
